schema_version = 1

[package]
name = "inetutils"
version = "2.8"
release = "2"
description = "Basic networking utilities (ping, hostname, ftp, ...)"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftpmirror.gnu.org/inetutils/inetutils-2.8.tar.gz"
sha256 = ""

dependencies = [
    "ncurses-libs >= 6.6",
    "readline >= 8.3",
    "libxcrypt >= 4.5.2"
]

build_dependencies = [
    "ncurses-dev >= 6.6",
    "readline-dev >= 8.3",
    "libxcrypt-dev >= 4.5.2"
]

provides = [
    "inetutils"
]

prepare = []

build = [
    "./configure --prefix=/usr --bindir=/usr/bin --localstatedir=/var --disable-logger --disable-whois --disable-rcp --disable-rexec --disable-rlogin --disable-rsh --disable-servers --disable-telnet",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/sbin",
    "mv -v $DESTDIR/usr/bin/ifconfig $DESTDIR/usr/sbin/ 2>/dev/null || true",
    "mv -v $DESTDIR/usr/bin/hostname $DESTDIR/usr/sbin/ 2>/dev/null || true"
]
