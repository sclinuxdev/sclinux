schema_version = 1

[package]
name = "gdbm-dev"
version = "1.26"
release = "2"
description = "gdbm headers, pkg-config and linker symlink"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/gdbm/gdbm-1.26.tar.gz"
sha256 = ""

dependencies = [
    "gdbm-libs >= 1.26"
]

provides = [
    "gdbm-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --enable-libgdbm-compat",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
