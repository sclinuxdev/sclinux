schema_version = 1

[package]
name = "grep"
version = "3.12"
release = "2"
description = "GNU grep"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/grep/grep-3.12.tar.xz"
sha256 = ""

dependencies = [
    "pcre2-libs >= 10.47"
]

build_dependencies = [
    "pcre2-dev >= 10.47"
]

provides = [
    "grep"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-nls",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
