schema_version = 1

[package]
name = "autoconf"
version = "2.73"
release = "2"
description = "GNU autoconf"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = ""

dependencies = [
    "perl >= 5.44.0",
    "m4 >= 1.4.21"
]

build_dependencies = [
    "perl >= 5.44.0",
    "m4 >= 1.4.21"
]

provides = [
    "autoconf"
]

prepare = []

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
