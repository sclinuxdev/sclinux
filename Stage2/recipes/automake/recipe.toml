schema_version = 1

[package]
name = "automake"
version = "1.18.1"
release = "2"
description = "GNU automake"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftpmirror.gnu.org/automake/automake-1.18.1.tar.xz"
sha256 = ""

dependencies = [
    "perl >= 5.44.0",
    "autoconf >= 2.73"
]

build_dependencies = [
    "perl >= 5.44.0",
    "autoconf >= 2.71"
]

provides = [
    "automake"
]

prepare = []

build = [
    "./configure --prefix=/usr --docdir=/usr/share/doc/automake-1.18.1",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
