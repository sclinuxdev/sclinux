schema_version = 1

[package]
name = "libtool"
version = "2.6.2"
release = "2"
description = "GNU libtool, libtoolize, libltdl and development macros"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/libtool/libtool-2.6.2.tar.xz"
sha256 = ""

dependencies = [
    "glibc >= 2.44"
]

provides = [
    "libtool",
    "so:libltdl.so.7"
]

prepare = []

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
