schema_version = 1

[package]
name = "bzip2-libs"
version = "1.0.8"
release = "2"
description = "libbz2 shared runtime library"
license = "bzip2-1.0.6"
channel = "system"

[source]
url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = ""

dependencies = [
    "glibc >= 2.44"
]

provides = [
    "bzip2-libs",
    "so:libbz2.so.1",
    "so:libbz2.so.1.0"
]

prepare = []

build = [
    "make -f Makefile-libbz2_so -j$(nproc)"
]

install = [
    "mkdir -p $DESTDIR/usr/lib",
    "cp -a libbz2.so.1.0.8 $DESTDIR/usr/lib/",
    "ln -sf libbz2.so.1.0.8 $DESTDIR/usr/lib/libbz2.so.1.0",
    "ln -sf libbz2.so.1.0.8 $DESTDIR/usr/lib/libbz2.so.1"
]
