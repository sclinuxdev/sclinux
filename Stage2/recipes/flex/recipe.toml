schema_version = 1

[package]
name = "flex"
version = "2.6.4"
release = "2"
description = "Lexical analyzer generator"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = ""

dependencies = [
    "m4 >= 1.4.21"
]

build_dependencies = [
    "m4 >= 1.4.21",
    "bison >= 3.8.2"
]

provides = [
    "flex"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "ln -sf flex $DESTDIR/usr/bin/lex"
]
