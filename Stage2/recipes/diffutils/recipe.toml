schema_version = 1

[package]
name = "diffutils"
version = "3.12"
release = "2"
description = "GNU diff and cmp"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/diffutils/diffutils-3.12.tar.xz"
sha256 = ""

dependencies = []

build_dependencies = []

provides = [
    "diffutils"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-nls",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
