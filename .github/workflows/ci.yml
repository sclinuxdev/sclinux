name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/shc is shipped as /usr/bin/shc, so a broken alias table is a
      # broken system command. The suite asserts the exact argument vector
      # handed to sage, including that aliases expand only in the subcommand
      # position -- a package named `rm` must survive `sage install rm`.
      - name: shc wrapper behaviour
        run: sh tests/test-shc.sh

      - name: shell lint
        run: shellcheck -s sh scripts/shc tests/test-shc.sh

      - name: architecture build config
        run: python3 tests/test-build.py

      # Field names and types are checked against what sage's parse_toml
      # actually reads; an unknown key is silently ignored by sage, so it is
      # almost always a typo.
      - name: recipe validator fixtures
        run: python3 tests/test-validate-recipes.py

      - name: recipe schema
        run: python3 tests/validate-recipes.py

      - name: markdown checker fixtures
        run: python3 tests/test-check-links.py

      - name: markdown links and anchors
        run: python3 tests/check-links.py

      # 被 force-push 或 rebase-merge 改写掉的钉还能下载一阵子，然后开始 404，
      # 据此记录的构建一并失效。判据只在上游的提交图里，所以这一项需要网络：
      # 用 --filter=blob:none 取回默认分支的图，再由 git 判定祖先关系。
      - name: upstream pin checker fixtures
        run: python3 tests/test-check-pins.py

      - name: upstream commit pins
        run: python3 tests/check-pins.py --require-network
