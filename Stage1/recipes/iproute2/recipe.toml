schema_version = 1

[package]
name = "iproute2"
version = "7.1.0"
release = "1"
description = "IP routing and traffic control utilities (ip, ss, tc, ...)"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.1.0.tar.xz"
sha256 = ""

dependencies = [
]

build_dependencies = [
    "bison >= 3.8",
    "flex >= 2.6",
]

provides = [
    "iproute2",
]

prepare = [
]

build = [
    "make -j$(nproc)",
]

install = [
    "make DESTDIR=$DESTDIR install",
]
