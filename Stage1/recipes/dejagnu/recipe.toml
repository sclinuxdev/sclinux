schema_version = 1

[package]
name = "dejagnu"
version = "1.6.3"
release = "1"
description = "Framework for testing other programs (DejaGNU)"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftp.gnu.org/gnu/dejagnu/dejagnu-1.6.3.tar.gz"
sha256 = ""

dependencies = [
    "expect >= 5.45",
    "tcl >= 8.6",
]

build_dependencies = [
]

provides = [
    "dejagnu",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
