schema_version = 1

[package]
name = "texinfo"
version = "7.3"
release = "3"
description = "Documentation system for producing online and printed manuals"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/texinfo/texinfo-7.3.tar.xz"
sha256 = "51f74eb0f51cfa9873b85264dfdd5d46e8957ec95b88f0fb762f63d9e164c72e"

dependencies = [
]

build_dependencies = [
    "perl",
]

provides = [
    "texinfo",
]

prepare = [
]

build = [
    "PERL=/usr/bin/perl ./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/share/info/dir",
]
