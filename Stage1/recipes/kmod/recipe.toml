schema_version = 1

[package]
name = "kmod"
version = "34.2"
release = "2"
description = "Kernel module management tools (modprobe, lsmod, depmod) and libkmod"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"
sha256 = "5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54"

dependencies = [
    "xz-libs >= 5.6.0",
    "zlib >= 1.3.0",
    "openssl-libs >= 3.0.0",
]

build_dependencies = [
    "meson >= 1.5",
    "ninja >= 1.11",
    "pkgconf >= 2.0",
    "openssl-dev >= 3.0.0",
    "zlib-dev >= 1.3.0",
]

provides = [
    "kmod",
    "so:libkmod.so.2",
]

prepare = [
]

build = [
    "mkdir -p build",
    "cd build && meson setup --prefix=/usr --libdir=lib --buildtype=release -D manpages=false ..",
    "cd build && ninja -j$(nproc)",
]

install = [
    "cd build && DESTDIR=$DESTDIR ninja install",
]
