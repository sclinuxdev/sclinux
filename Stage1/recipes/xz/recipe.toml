schema_version = 1

[package]
name = "xz"
version = "5.8.3"
release = "2"
description = "XZ-format compression utilities"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://tukaani.org/xz/xz-5.8.3.tar.xz"
sha256 = ""

dependencies = [
    "xz-libs >= 5.8.3",
]

provides = [
    "xz",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/xz-5.8.3",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    # 拆分：liblzma 与头文件归 xz-libs
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib/liblzma* $DESTDIR/usr/lib/pkgconfig/liblzma.pc",
]
