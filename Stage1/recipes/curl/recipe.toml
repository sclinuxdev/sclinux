schema_version = 1

[package]
name = "curl"
version = "8.21.0"
release = "1"
description = "Command line tool and library for transferring data with URLs"
license = "curl"
channel = "system"

[source]
url = "https://curl.se/download/curl-8.21.0.tar.xz"
sha256 = "aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6"

dependencies = [
    "openssl-libs >= 3.0.0",
    "zlib >= 1.3.0",
    "zstd-libs >= 1.5.0",
]

build_dependencies = [
    "openssl-dev >= 3.0.0",
    "zlib-dev >= 1.3.0",
]

provides = [
    "curl",
    "so:libcurl.so.4",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --with-openssl --with-zlib --with-zstd --without-brotli --without-nghttp2 --without-libpsl --without-libidn2",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
