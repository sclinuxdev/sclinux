schema_version = 1

[package]
name = "lz4"
version = "1.10.0"
release = "2"
description = "Extremely fast compression tool (lz4)"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = ""

dependencies = [
    "lz4-libs >= 1.10.0",
]

provides = [
    "lz4",
]

prepare = [
]

build = [
    "make prefix=/usr -j$(nproc)",
]

install = [
    "make prefix=/usr install DESTDIR=$DESTDIR",
    # 拆分：liblz4 与头文件/cmake/pc 归 lz4-libs
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib/liblz4* $DESTDIR/usr/lib/pkgconfig/liblz4.pc $DESTDIR/usr/lib/cmake",
]
