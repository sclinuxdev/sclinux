schema_version = 1

[package]
name = "fastfetch"
version = "2.67.1"
release = "1"
description = "Fast, highly customizable system information tool written in C"
license = "MIT"
channel = "system"

[source]
url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.67.1.tar.gz"
sha256 = ""

dependencies = [
    "glibc >= 2.44",
    "zlib >= 1.3.0",
    "sqlite >= 3.45.0",
]

build_dependencies = [
    "cmake >= 3.25.0",
    "pkgconf >= 2.0.0",
    "zlib-dev >= 1.3.0",
]

provides = [
    "fastfetch",
]

prepare = [
]

build = [
    "cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF",
    "cmake --build build -j$(nproc)",
]

install = [
    "DESTDIR=$DESTDIR cmake --install build",
]
