schema_version = 1

[package]
name = "pcre2-libs"
version = "10.47"
release = "1"
description = "libpcre2-8/16/32 and libpcre2-posix shared libraries and headers"
license = "BSD-3-Clause"
channel = "system"

[source]
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2"
sha256 = "47fe8c99461250d42f89e6e8fdaeba9da057855d06eb7fc08d9ca03fd08d7bc7"

dependencies = [
    "bzip2-libs >= 1.0.8",
    "zlib >= 1.3.0",
]

provides = [
    "pcre2-libs",
    "so:libpcre2-8.so.0",
    "so:libpcre2-16.so.0",
    "so:libpcre2-32.so.0",
    "so:libpcre2-posix.so.3",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --enable-pcre2-16 --enable-pcre2-32 --enable-jit --disable-static --disable-pcre2grep --disable-pcre2test",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
