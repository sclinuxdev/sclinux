schema_version = 1

[package]
name = "gettext"
version = "1.0"
release = "1"
description = "GNU internationalization (i18n) tools and libintl"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

dependencies = [
]

provides = [
    "gettext",
    "so:libintl.so.8",
    "so:libasprintf.so.1",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-1.0",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "chmod -v 0755 $DESTDIR/usr/lib/preloadable_libintl.so",
]
