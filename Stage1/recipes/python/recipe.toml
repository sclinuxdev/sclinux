schema_version = 1

[package]
name = "python"
version = "3.14.7"
release = "1"
description = "Python 3 programming language (interpreter, stdlib, pip)"
license = "PSF-2.0"
channel = "system"

[source]
url = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = ""

dependencies = [
    "libffi >= 3.4.0",
    "sqlite >= 3.40.0",
    "mpdecimal >= 4.0.0",
    "expat >= 2.6.0",
    "openssl-libs >= 3.0.0",
    "zlib >= 1.3.0",
    "bzip2-libs >= 1.0.8",
    "xz-libs >= 5.6.0",
    "zstd-libs >= 1.5.0",
    "lz4-libs >= 1.9.0",
    "ncurses-libs >= 6.4",
    "readline >= 8.2",
]

build_dependencies = [
    "openssl-dev >= 4.0.0",
    "zlib-dev >= 1.3.0",
]

provides = [
    "python",
    "so:libpython3.14.so.1.0",
]

prepare = [
]

build = [
    "CFLAGS=\"$CFLAGS -DOPENSSL_NO_SSL3 -DOPENSSL_NO_SSL3_METHOD -DOPENSSL_NO_TLS1 -DOPENSSL_NO_TLS1_METHOD -DOPENSSL_NO_TLS1_1 -DOPENSSL_NO_TLS1_1_METHOD -DOPENSSL_NO_TLS1_2 -DOPENSSL_NO_TLS1_2_METHOD\" ./configure --prefix=/usr --enable-shared --with-system-expat --without-ensurepip --without-static-libpython",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/etc",
    "printf '[global]\\nroot-user-action = ignore\\ndisable-pip-version-check = true\\n' > $DESTDIR/etc/pip.conf",
]
