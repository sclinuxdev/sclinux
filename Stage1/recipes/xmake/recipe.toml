schema_version = 1

[package]
name = "xmake"
version = "3.1.0"
release = "5"
description = "Lightweight cross-platform C/C++ build utility based on Lua"
license = "Apache-2.0"
channel = "toolchain/xmake:3"

[source]
url = "https://github.com/xmake-io/xmake/releases/download/v3.1.0/xmake-v3.1.0.tar.gz"
sha256 = "84aae0926d293f486297dfb63fc4cd802218124c9c91b141f2004dcc4d509fdd"

dependencies = [
]

provides = [
    "xmake",
]

prepare = [
]

build = [
    "./configure --runtime=lua --prefix=/opt/channels/xmake/3",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR PREFIX=/opt/channels/xmake/3",
    "mkdir -p $DESTDIR/opt/channels/xmake/3/share/xmake/modules/private/action/require/impl/actions",
    "install -m 644 xmake/modules/private/action/require/impl/actions/download_resources.lua $DESTDIR/opt/channels/xmake/3/share/xmake/modules/private/action/require/impl/actions/download_resources.lua",
    "true # Safety net: xmake's Makefile keys on uppercase PREFIX; if it still fell back to /usr, relocate to the declared channel layout",
    "if [ -e \"$DESTDIR/usr/bin/xmake\" ] && [ ! -e \"$DESTDIR/opt/channels/xmake/3/bin/xmake\" ]; then mkdir -p \"$DESTDIR/opt/channels/xmake/3\"; mv \"$DESTDIR/usr/bin\" \"$DESTDIR/opt/channels/xmake/3/bin\"; mkdir -p \"$DESTDIR/opt/channels/xmake/3/share\"; mv \"$DESTDIR/usr/share/xmake\" \"$DESTDIR/opt/channels/xmake/3/share/xmake\"; rmdir \"$DESTDIR/usr/share\" \"$DESTDIR/usr/bin\" 2>/dev/null || true; fi",
    "[ -x \"$DESTDIR/opt/channels/xmake/3/bin/xmake\" ] || { echo 'ERROR: xmake not installed at /opt/channels/xmake/3/bin/xmake' >&2; exit 1; }",
    "mv $DESTDIR/opt/channels/xmake/3/bin/xmake $DESTDIR/opt/channels/xmake/3/bin/xmake.real",
    "install -m 755 $RECIPE_DIR/xmake-channel-wrapper.sh $DESTDIR/opt/channels/xmake/3/bin/xmake",
]
