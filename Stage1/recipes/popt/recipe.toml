schema_version = 1

[package]
name = "popt"
version = "1.19"
release = "1"
description = "Command-line option parser library"
license = "MIT"
channel = "system"

[source]
url = "https://ftp.osuosl.org/pub/rpm/popt/releases/popt-1.x/popt-1.19.tar.gz"
sha256 = "c25a4838fc8e4c1c8aacb8bd620edb3084a3d63bf8987fdad3ca2758c63240f9"

dependencies = [
    "glibc >= 2.44",
]

build_dependencies = [
    "gcc >= 15.3.0",
    "make >= 4.4",
]

provides = [
    "popt",
    "so:libpopt.so.0",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --libdir=/usr/lib",
    "make -j$(nproc)",
]

install = [
    "make DESTDIR=$DESTDIR install",
]
