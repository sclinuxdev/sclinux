schema_version = 1

[package]
name = "lz4-libs"
version = "1.10.0"
release = "1"
description = "liblz4 shared library and headers"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = ""

dependencies = [
]

provides = [
    "lz4-libs",
    "so:liblz4.so.1",
]

prepare = [
]

build = [
    "make -C lib prefix=/usr -j$(nproc)",
]

install = [
    "make -C lib prefix=/usr install DESTDIR=$DESTDIR",
]
