schema_version = 1

[package]
name = "gzip"
version = "1.14"
release = "2"
description = "Standard GNU compression utilities"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/gzip/gzip-1.14.tar.xz"
sha256 = ""

dependencies = [
]

build_dependencies = [
    "gettext >= 0.22",
]

provides = [
    "gzip",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
