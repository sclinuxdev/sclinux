schema_version = 1

[package]
name = "xz-libs"
version = "5.8.3"
release = "2"
description = "liblzma shared library and header"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://tukaani.org/xz/xz-5.8.3.tar.xz"
sha256 = "fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6"

dependencies = [
]

provides = [
    "xz-libs",
    "so:liblzma.so.5",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo --disable-lzma-links --disable-scripts --disable-doc",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/share/locale",
]
