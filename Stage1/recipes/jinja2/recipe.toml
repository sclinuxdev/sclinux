schema_version = 1

[package]
name = "jinja2"
version = "3.1.6"
release = "1"
description = "Python template engine (Jinja2)"
license = "BSD-3-Clause"
channel = "system"

[source]
url = "https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz"
sha256 = ""

dependencies = [
    "python >= 3.12.0",
    "markupsafe >= 2.0",
]

build_dependencies = [
    "python >= 3.12.0",
    "flit-core >= 3.9.0",
    "wheel >= 0.40.0",
]

provides = [
    "jinja2",
]

prepare = [
]

build = [
    "python3 -m flit_core.wheel",
]

install = [
    "mkdir -p $DESTDIR/usr/lib/python3.14/site-packages",
    "python3 -c \"import sys, zipfile, glob; [zipfile.ZipFile(f).extractall(sys.argv[1]) for f in glob.glob('dist/*.whl')]\" $DESTDIR/usr/lib/python3.14/site-packages",
]
