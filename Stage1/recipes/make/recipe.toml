schema_version = 1

[package]
name = "make"
version = "4.4.1"
release = "2"
description = "GNU make utility to maintain groups of programs"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/make/make-4.4.1.tar.gz"
sha256 = ""

dependencies = [
]

build_dependencies = [
    "gettext >= 0.22",
]

provides = [
    "make",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
