schema_version = 1

[package]
name = "glibc"
version = "2.44"
release = "2"
description = "The GNU C Library"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = ""

dependencies = [
    "linux-headers >= 6.10.0",
]

build_dependencies = [
    "bison >= 3.8",
    "python >= 3.12",
]

provides = [
    "glibc",
    "virtual/libc",
    "so:libc.so.6",
    "so:ld-linux-x86-64.so.2",
]

prepare = [
    "mkdir -p build",
]

build = [
    "cd build && ../configure --prefix=/usr --disable-profile --enable-kernel=4.19 --enable-stack-protector=strong --disable-nscd libc_cv_slibdir=/usr/lib",
    "cd build && make -j$(nproc)",
]

install = [
    "cd build && make install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/lib/locale",
    "sed '/RTLDLIST/s@/usr@@g' -i $DESTDIR/usr/bin/ldd 2>/dev/null || true",
]
