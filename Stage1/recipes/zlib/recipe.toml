schema_version = 1

[package]
name = "zlib"
version = "1.3.2"
release = "2"
description = "Standard compression library (runtime lib)"
license = "Zlib"
channel = "system"

[source]
url = "https://zlib.net/zlib-1.3.2.tar.gz"
sha256 = ""

dependencies = [
]

provides = [
    "zlib",
    "so:libz.so.1",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    # 拆分：头文件/静态库/.so 符号链接/pc 归 zlib-dev，此处剔除
    "rm -f $DESTDIR/usr/lib/libz.a $DESTDIR/usr/lib/libz.so $DESTDIR/usr/lib/pkgconfig/zlib.pc",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/share/man",
]
