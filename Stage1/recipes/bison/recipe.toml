schema_version = 1

[package]
name = "bison"
version = "3.8.2"
release = "3"
description = "Parser generator (yacc-compatible)"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

dependencies = [
]

build_dependencies = [
]

provides = [
    "bison",
]

prepare = [
]

build = [
    "M4=m4 ./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2",
    "TARGET_LOADER=$SC_BUILD_SYSROOT/usr/lib/@SC_DYNAMIC_LINKER@; if [ ! -e $TARGET_LOADER ]; then for directory in /lib /lib64 /usr/lib /usr/lib64; do if [ -e $directory/@SC_DYNAMIC_LINKER@ ]; then TARGET_LOADER=$directory/@SC_DYNAMIC_LINKER@; break; fi; done; fi; [ -e $TARGET_LOADER ] || { echo 'ERROR: dynamic loader not found' >&2; exit 1; }; PREBISON=\"$TARGET_LOADER --library-path $SC_BUILD_SYSROOT/usr/lib:$SC_BUILD_SYSROOT/usr/lib64:$SC_BUILD_SYSROOT/lib:$SC_BUILD_SYSROOT/lib64\" make -j$(nproc)",
]

install = [
    "TARGET_LOADER=$SC_BUILD_SYSROOT/usr/lib/@SC_DYNAMIC_LINKER@; if [ ! -e $TARGET_LOADER ]; then for directory in /lib /lib64 /usr/lib /usr/lib64; do if [ -e $directory/@SC_DYNAMIC_LINKER@ ]; then TARGET_LOADER=$directory/@SC_DYNAMIC_LINKER@; break; fi; done; fi; [ -e $TARGET_LOADER ] || { echo 'ERROR: dynamic loader not found' >&2; exit 1; }; PREBISON=\"$TARGET_LOADER --library-path $SC_BUILD_SYSROOT/usr/lib:$SC_BUILD_SYSROOT/usr/lib64:$SC_BUILD_SYSROOT/lib:$SC_BUILD_SYSROOT/lib64\" make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/share/info/dir",
]
