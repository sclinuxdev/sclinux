schema_version = 1

[package]
name = "bison"
version = "3.8.2"
release = "1"
description = "Parser generator (yacc-compatible)"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = ""

dependencies = [
]

build_dependencies = [
]

provides = [
    "bison",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
