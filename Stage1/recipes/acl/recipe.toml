schema_version = 1

[package]
name = "acl"
version = "2.4.0"
release = "1"
description = "Access Control List tools and library"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://download-mirror.savannah.gnu.org/releases/acl/acl-2.4.0.tar.xz"
sha256 = ""

dependencies = [
    "attr >= 2.5.0",
]

provides = [
    "acl",
    "so:libacl.so.1",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --sysconfdir=/etc --docdir=/usr/share/doc/acl-2.4.0",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
