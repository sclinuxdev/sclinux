schema_version = 1

[package]
name = "gawk"
version = "5.4.1"
release = "2"
description = "GNU awk text processing language"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = ""

dependencies = [
]

build_dependencies = [
    "gettext >= 0.22",
]

provides = [
    "gawk",
    "awk",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "ln -sf gawk $DESTDIR/usr/bin/awk",
]
