schema_version = 1

[package]
name = "libelf"
version = "0.196"
release = "1"
description = "libelf shared library for reading ELF files (from elfutils)"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://sourceware.org/elfutils/ftp/0.196/elfutils-0.196.tar.bz2"
sha256 = ""

build_dependencies = [
    "zlib-dev >= 1.3.0",
    "pkgconf",
]

dependencies = [
    "zlib >= 1.3.0",
]

provides = [
    "libelf",
    "so:libelf.so.1",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy",
    "make -C lib -j$(nproc)",
    "make -C libelf -j$(nproc)",
]

install = [
    "make -C libelf install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/lib/pkgconfig",
    "install -vm644 config/libelf.pc $DESTDIR/usr/lib/pkgconfig/",
    "rm -f $DESTDIR/usr/lib/libelf.a",
]
