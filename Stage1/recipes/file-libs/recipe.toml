schema_version = 1

[package]
name = "file-libs"
version = "5.48"
release = "1"
description = "libmagic shared library and header"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://astron.com/pub/file/file-5.48.tar.gz"
sha256 = "ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283"

dependencies = [
]

provides = [
    "file-libs",
    "so:libmagic.so.1",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    # 拆分：剔除 file 工具本体，仅保留 libmagic + 头文件 + pc
    "rm -f $DESTDIR/usr/bin/file $DESTDIR/usr/share/man/man1/file.1*",
]
