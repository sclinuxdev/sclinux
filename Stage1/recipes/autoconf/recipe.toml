schema_version = 1

[package]
name = "autoconf"
version = "2.73"
release = "1"
description = "GNU automatic configure script generator"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"

dependencies = [
]

build_dependencies = [
    "perl",
]

provides = [
    "autoconf",
]

prepare = [
]

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
