schema_version = 1

[package]
name = "expect"
version = "5.45.4"
release = "4"
description = "Tool for automating interactive applications (expect/tk)"
license = "Public-domain"
channel = "system"

[source]
url = "https://downloads.sourceforge.net/project/expect/Expect/5.45.4/expect5.45.4.tar.gz"
sha256 = "49a7da83b0bdd9f46d04a04deec19c7767bb9a323e40c4781f89caf760b92c34"

dependencies = [
    "tcl >= 8.6",
]

build_dependencies = [
]

provides = [
    "expect",
    "so:libexpect5.45.4.so",
]

prepare = [
]

build = [
    'CFLAGS="-O2 -std=gnu17 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-incompatible-pointer-types" ./configure --build=@SC_GNU_TRIPLET@ --prefix=/usr --with-tcl="${SC_BUILD_SYSROOT:-}/usr/lib" --enable-shared --mandir=/usr/share/man --with-tclinclude="${SC_BUILD_SYSROOT:-}/usr/include"',
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR TCLSH_PROG=${SC_BUILD_SYSROOT:-}/.stage1-tool-wrappers/usr/bin/tclsh8.6 TCLSH_ENV=\"env -u LD_LIBRARY_PATH TCL_LIBRARY=${SC_BUILD_SYSROOT:-}/usr/lib/tcl8.6 TCLLIBPATH=.\"",
    "ln -sfv expect5.45.4/libexpect5.45.4.so $DESTDIR/usr/lib/ 2>/dev/null || true",
]
