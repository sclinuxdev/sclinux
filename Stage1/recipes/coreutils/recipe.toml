schema_version = 1

[package]
name = "coreutils"
version = "9.11"
release = "2"
description = "The basic file, shell and text manipulation utilities of the GNU operating system"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz"
sha256 = ""

dependencies = [
]

build_dependencies = [
    "gettext >= 0.22",
]

provides = [
    "coreutils",
]

prepare = [
]

build = [
    "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --enable-install-program=hostname --enable-no-install-program=kill,uptime",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
