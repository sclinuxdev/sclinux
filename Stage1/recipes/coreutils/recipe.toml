schema_version = 1

[package]
name = "coreutils"
version = "9.11"
release = "3"
description = "The basic file, shell and text manipulation utilities of the GNU operating system"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz"
sha256 = "394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3"

dependencies = [
]

build_dependencies = [
    "gettext >= 0.22",
]

provides = [
    "coreutils",
]

prepare = [
    "sed -i 's#`$prog $opt 2>$stderr`#`$ENV{SC_TARGET_RUNNER} $prog $opt 2>$stderr`#' man/help2man",
]

build = [
    "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --without-openssl --enable-install-program=hostname --enable-no-install-program=kill,uptime",
    "SC_TARGET_RUNNER=\"$SC_BUILD_SYSROOT/usr/lib/@SC_DYNAMIC_LINKER@ --library-path $SC_BUILD_SYSROOT/usr/lib:$SC_BUILD_SYSROOT/usr/lib64:$SC_BUILD_SYSROOT/lib:$SC_BUILD_SYSROOT/lib64\" make -j$(nproc)",
]

install = [
    "SC_TARGET_RUNNER=\"$SC_BUILD_SYSROOT/usr/lib/@SC_DYNAMIC_LINKER@ --library-path $SC_BUILD_SYSROOT/usr/lib:$SC_BUILD_SYSROOT/usr/lib64:$SC_BUILD_SYSROOT/lib:$SC_BUILD_SYSROOT/lib64\" make install DESTDIR=$DESTDIR cu_install_program=install",
]
