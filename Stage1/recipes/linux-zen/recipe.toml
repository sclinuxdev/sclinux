schema_version = 1

[package]
name = "linux-zen"
version = "7.1.9"
release = "1"
description = "Linux ZEN kernel with performance optimizations for desktop, multimedia, and gaming"
license = "GPL-2.0-only"
channel = "system"

[source]
url = "https://mirrors.tuna.tsinghua.edu.cn/kernel/v7.x/linux-7.1.9.tar.xz"
sha256 = ""

dependencies = [
    "kmod >= 34.0",
]

build_dependencies = [
    "bc >= 1.07",
    "bison >= 3.8",
    "flex >= 2.6",
    "libelf >= 0.190",
    "openssl-dev >= 4.0.1",
    "perl >= 5.38",
    "python >= 3.12",
    "tar >= 1.35",
    "xz >= 5.6",
    "zlib-dev >= 1.3.0",
    "zstd >= 1.5.0",
]

provides = [
    "linux-zen",
    "virtual/linux",
    "virtual/kernel",
]

prepare = [
    "[ -f .prepared ] || zstd -dc ../distfiles/linux-v7.1.9-zen1.patch.zst | patch -p1 --forward --batch || true",
    "[ -f .prepared ] || cp -v ../config.x86_64 .config",
    "[ -f .prepared ] || echo '-1' > localversion.10-pkgrel",
    "[ -f .prepared ] || echo '-zen' > localversion.20-pkgname",
    "[ -f .prepared ] || ./scripts/config --disable DEBUG_INFO --enable DEBUG_INFO_NONE --disable DEBUG_INFO_DWARF5 --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES --disable RUST",
    "[ -f .prepared ] || make olddefconfig",
    "[ -f .prepared ] || touch .prepared",
]

build = [
    "make -j$(nproc) -k KCFLAGS=\"-Wno-error\" all || make -j$(nproc) KCFLAGS=\"-Wno-error\" all",
]

install = [
    "KVER=$(make -s kernelrelease)",
    "echo \"Installing kernel release: ${KVER}\"",
    "mkdir -p $DESTDIR/boot $DESTDIR/usr/lib/modules",
    "make INSTALL_MOD_PATH=$DESTDIR modules_install",
    "if [ -d $DESTDIR/lib/modules ] && [ ! -L $DESTDIR/lib ]; then cp -a $DESTDIR/lib/modules $DESTDIR/usr/lib/ && rm -rf $DESTDIR/lib; fi",
    "rm -f $DESTDIR/usr/lib/modules/$KVER/build $DESTDIR/usr/lib/modules/$KVER/source",
    "install -Dm644 arch/x86/boot/bzImage $DESTDIR/boot/vmlinuz-${KVER}",
    "install -Dm644 System.map $DESTDIR/boot/System.map-${KVER}",
    "install -Dm644 .config $DESTDIR/boot/config-${KVER}",
    "install -Dm644 arch/x86/boot/bzImage $DESTDIR/usr/lib/modules/$KVER/vmlinuz",
]
