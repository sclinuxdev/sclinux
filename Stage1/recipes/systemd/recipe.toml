schema_version = 1

[package]
name = "systemd"
version = "261.2"
release = "1"
description = "System and service manager (init), udev, journald"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = ""

dependencies = [
    "kmod >= 34.0",
    "util-linux-libs >= 2.40",
    "libcap >= 2.70",
    "zstd-libs >= 1.5.0",
    "lz4-libs >= 1.9.0",
    "xz-libs >= 5.6.0",
    "openssl-libs >= 4.0.0",
    "pcre2-libs >= 10.40",
    "glibc >= 2.44",
]

build_dependencies = [
    "meson >= 1.5.0",
    "ninja >= 1.11.0",
    "python >= 3.12.0",
    "jinja2 >= 3.1.0",
    "markupsafe >= 3.0.0",
    "gperf >= 3.1",
    "gettext >= 0.22",
    "kmod >= 34.0",
    "util-linux-libs >= 2.40",
    "openssl-dev >= 4.0.0",
    "pkgconf >= 2.0",
]

provides = [
    "systemd",
    "virtual/init",
    "virtual/udev",
    "so:libsystemd.so.0",
    "so:libudev.so.1",
]

prepare = [
    "sed -e 's/GROUP=\"render\"/GROUP=\"video\"/' -e 's/GROUP=\"sgx\", //' -i rules.d/50-udev-default.rules.in",
]

build = [
    "mkdir -p build",
    "cd build && meson setup .. --prefix=/usr --buildtype=release -D default-dnssec=no -D firstboot=false -D install-tests=false -D ldconfig=false -D sysusers=false -D rpmmacrosdir=no -D homed=disabled -D man=disabled -D mode=release -D pamconfdir=no -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled -D docdir=/usr/share/doc/systemd-261.2",
    "cd build && ninja -j$(nproc)",
]

install = [
    "cd build && DESTDIR=$DESTDIR ninja install",
    "rm -rf $DESTDIR/usr/share/doc 2>/dev/null || true",
]
