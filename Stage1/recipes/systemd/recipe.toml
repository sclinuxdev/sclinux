schema_version = 1

[package]
name = "systemd"
version = "261.2"
release = "6"
description = "System and service manager (init), udev, journald"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

dependencies = [
    "kmod >= 34.0",
    "util-linux-libs >= 2.40",
    "libcap >= 2.70",
    "zstd-libs >= 1.5.0",
    "lz4-libs >= 1.9.0",
    "xz-libs >= 5.6.0",
    "openssl-libs >= 4.0.0",
    "pcre2-libs >= 10.40",
    "glibc >= 2.44",
    "python-pyelftools >= 0.33",
]

build_dependencies = [
    "meson >= 1.5.0",
    "ninja >= 1.11.0",
    "python >= 3.12.0",
    "jinja2 >= 3.1.0",
    "markupsafe >= 3.0.0",
    "gperf >= 3.1",
    "gettext >= 0.22",
    "kmod >= 34.0",
    "util-linux-libs >= 2.40",
    "openssl-dev >= 4.0.0",
    "pkgconf >= 2.0",
]

provides = [
    "systemd",
    "virtual/init",
    "virtual/udev",
    "so:libsystemd.so.0",
    "so:libudev.so.1",
]

prepare = [
    "sed -e 's/GROUP=\"render\"/GROUP=\"video\"/' -e 's/GROUP=\"sgx\", //' -i rules.d/50-udev-default.rules.in",
]

build = [
    "mkdir -p build",
    "cd build && env -u CPATH CPPFLAGS= C_INCLUDE_PATH=\"$SC_BUILD_SYSROOT/usr/include\" meson setup .. --prefix=/usr --sbindir=bin --libdir=lib --buildtype=release -D default-dnssec=no -D firstboot=false -D install-tests=false -D ldconfig=false -D sysusers=false -D rpmmacrosdir=no -D homed=disabled -D man=disabled -D mode=release -D pamconfdir=no -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled -D dbuspolicydir=/usr/share/dbus-1/system.d -D dbussessionservicedir=/usr/share/dbus-1/services -D dbussystemservicedir=/usr/share/dbus-1/system-services -D dbus-interfaces-dir=/usr/share/dbus-1/interfaces -D efi=true -D bootloader=enabled -D sbat-distro=sclinux -D sbat-distro-generation=1 -D sbat-distro-version=261.2-5 -D sbat-distro-summary='ShenChen Linux' -D sbat-distro-url=https://github.com/sclinuxdev/sclinux -D docdir=/usr/share/doc/systemd-261.2",
    "cd build && env -u CPATH CPPFLAGS= C_INCLUDE_PATH=\"$SC_BUILD_SYSROOT/usr/include\" ninja -j$(nproc)",
]

install = [
    "cd build && env -u CPATH CPPFLAGS= C_INCLUDE_PATH=\"$SC_BUILD_SYSROOT/usr/include\" DESTDIR=$DESTDIR ninja install",
    "if [ -d $DESTDIR/usr/sbin ]; then mv $DESTDIR/usr/sbin/* $DESTDIR/usr/bin/; rmdir $DESTDIR/usr/sbin; fi",
    "rm -rf $DESTDIR/usr/share/doc 2>/dev/null || true",
    # systemd 只往 usr/share/mime/packages/ 放一个 io.systemd.xml，声明它自己的
    # journal/DDI 文件类型。这个目录会命中 sage 内置的 mime-database 触发器，
    # 而触发器要执行的 /usr/bin/update-mime-database 由 shared-mime-info 提供，
    # 本仓库没有这个包 —— sage 77b0e29 起触发器缺可执行文件是硬失败（提交
    # 9190268 把 fail-open 改成了 fail-closed），于是整笔安装返回 1。
    # 打包 shared-mime-info 之后应当撤销这一行，让 systemd 的 MIME 类型生效。
    "rm -rf $DESTDIR/usr/share/mime 2>/dev/null || true",
]
