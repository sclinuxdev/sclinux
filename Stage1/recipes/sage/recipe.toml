schema_version = 1

[package]
name = "sage"
version = "0.2.0"
release = "5"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"

dependencies = [
    "lmdb >= 0.9.30",
    "zstd >= 1.5.0",
    "tomlplusplus >= 3.4.0",
    "curl >= 8.0.0",
    "gcc-libs >= 15.3.0",
]

build_dependencies = [
    "xmake >= 3.0.0",
]

provides = [
    "sage",
]

prepare = [
]

build = [
    # 全量重建在 chroot 内进行：宿主编排器将 distro 根 bind-mount 到 /distro
    "cd /distro/sage && XMAKE_ROOT=y xmake f -c -m release -y && XMAKE_ROOT=y xmake -y",
]

install = [
    "mkdir -p $DESTDIR/usr/bin $DESTDIR/etc/sage",
    "cp -av /distro/sage/build/linux/x86_64/release/sage $DESTDIR/usr/bin/sage",
]
