schema_version = 1

[package]
name = "sage"
version = "0.2.0"
release = "13"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"

dependencies = [
    "lmdb >= 0.9.30",
    "zstd-libs >= 1.5.0",
    "curl >= 8.0.0",
    "gcc-libs >= 15.3.0",
]

build_dependencies = [
    "gcc >= 15.3.0",
    "tomlplusplus >= 3.4.0",
    "xmake >= 3.0.0",
]

provides = [
    "sage",
]

prepare = [
]

build = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake f -c -m release -y --ldflags=\"$LDFLAGS\"",
    "XMAKE_ROOT=y XMAKE_STATS=false xmake -y",
]

install = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake install -o \"$DESTDIR/usr\" -y",
    "install -Dm755 ../shc \"$DESTDIR/usr/bin/shc\"",
]

[source]
url = "https://codeload.github.com/sclinuxdev/sage/tar.gz/f2d18f7f30f5cdc690b9ebb288858ae04f3337df"
sha256 = "95f67392824bb00048ccb5b012e094e4861e12f43f3b8ea335a2fd5e9b3f2860"
