schema_version = 1

[package]
name = "sage"
version = "0.2.0"
release = "5"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"

dependencies = [
    "lmdb >= 0.9.30",
    "zstd-libs >= 1.5.0",
    "curl >= 8.0.0",
    "gcc-libs >= 15.3.0",
]

build_dependencies = [
    "gcc >= 15.3.0",
    "tomlplusplus >= 3.4.0",
    "xmake >= 3.0.0",
]

provides = [
    "sage",
]

prepare = [
]

build = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake f -c -m release -y",
    "XMAKE_ROOT=y XMAKE_STATS=false xmake -y",
]

install = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake install -o \"$DESTDIR/usr\" -y",
]

[source]
url = "https://github.com/antinomie1/sage/archive/f61cdea1d601541756c0669966cd2b1e0119b7ef.tar.gz"
sha256 = "44bd80623164d86bfb5d664b3edd703d3d72e3eacfdb8411973d7bb0162fb517"
