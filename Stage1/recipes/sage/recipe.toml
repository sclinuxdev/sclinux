schema_version = 1

[package]
name = "sage"
version = "0.2.0"
release = "12"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"

dependencies = [
    "lmdb >= 0.9.30",
    "zstd-libs >= 1.5.0",
    "curl >= 8.0.0",
    "gcc-libs >= 15.3.0",
]

build_dependencies = [
    "gcc >= 15.3.0",
    "tomlplusplus >= 3.4.0",
    "xmake >= 3.0.0",
]

provides = [
    "sage",
]

prepare = [
]

build = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake f -c -m release -y --ldflags=\"$LDFLAGS\"",
    "XMAKE_ROOT=y XMAKE_STATS=false xmake -y",
]

install = [
    "XMAKE_ROOT=y XMAKE_STATS=false xmake install -o \"$DESTDIR/usr\" -y",
]

[source]
url = "https://codeload.github.com/antinomie1/sage/tar.gz/8629fdf9eec6a559514e7335c8a59fe27b5cfc47"
sha256 = "99a5fbda5c7d9adac210e5f6fe27896dde3efb85ee71da9c364a40ede13c530d"
