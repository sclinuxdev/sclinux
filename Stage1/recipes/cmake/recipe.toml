schema_version = 1

[package]
name = "cmake"
version = "3.31.6"
release = "1"
description = "Cross-platform open-source build system"
license = "BSD-3-Clause"
channel = "system"

[source]
url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6.tar.gz"
sha256 = "653427f0f5014750aafff22727fb2aa60c6c732ca91808cfb78ce22ddd9e55f0"

dependencies = [
    "glibc >= 2.44",
    "openssl-libs >= 4.0.1",
    "zlib >= 1.3.0",
    "bzip2-libs >= 1.0.8",
    "xz-libs >= 5.8.0",
    "zstd-libs >= 1.5.0",
    "curl >= 8.0.0",
    "expat >= 2.6.0",
    "libarchive >= 3.7.0",
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.0",
    "pkgconf >= 2.0.0",
]

provides = [
    "cmake",
]

prepare = [
]

build = [
    "CFLAGS=\"$CFLAGS -fpermissive\" CXXFLAGS=\"$CXXFLAGS -fpermissive\" ./bootstrap --prefix=/usr --parallel=$(nproc) --system-curl --system-zlib --system-bzip2 --system-zstd --system-liblzma --system-libarchive --system-expat --no-system-jsoncpp --no-system-librhash --no-system-cppdap",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
