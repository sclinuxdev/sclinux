schema_version = 1

[package]
name = "libffi"
version = "3.8.0"
release = "2"
description = "Portable Foreign Function Interface library"
license = "MIT"
channel = "system"

[source]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

dependencies = [
]

build_dependencies = [
]

provides = [
    "libffi",
    "so:libffi.so.8",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-multi-os-directory --with-gcc-arch=native",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/share/info/dir",
]
