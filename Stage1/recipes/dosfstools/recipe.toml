schema_version = 1

[package]
name = "dosfstools"
version = "4.2"
release = "1"
description = "FAT filesystem creation and checking utilities"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"

dependencies = [
    "glibc >= 2.44",
]

build_dependencies = [
    "gcc >= 15.3.0",
    "make >= 4.4",
]

provides = [
    "dosfstools",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --libexecdir=/usr/lib --sbindir=/usr/bin --mandir=/usr/share/man --docdir=/usr/share/doc/dosfstools --enable-compat-symlinks",
    "make -j$(nproc)",
]

install = [
    "make DESTDIR=$DESTDIR install",
]
