schema_version = 1

[package]
name = "libxcrypt"
version = "4.5.2"
release = "1"
description = "Extended crypt library for password hashing"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz"
sha256 = "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071"

dependencies = [
]

build_dependencies = [
]

provides = [
    "libxcrypt",
    "so:libcrypt.so.2",
]

prepare = [
]

build = [
    'CFLAGS="-O2 -std=gnu17" ./configure --prefix=/usr --enable-hashes=strong,glibc --enable-obsolete-api=no --disable-static --disable-failure-tokens --disable-werror',
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
