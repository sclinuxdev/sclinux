schema_version = 1

[package]
name = "libarchive"
version = "3.8.0"
release = "1"
description = "Multi-format archive and compression library (provides bsdtar and bsdcpio)"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://github.com/libarchive/libarchive/releases/download/v3.8.0/libarchive-3.8.0.tar.gz"
sha256 = "191b5b24811499d5c2e5efa3248975fa6daa5e6a227700cc7b8e54d6d7c06eef"

dependencies = [
    "glibc >= 2.44",
    "openssl-libs >= 4.0.1",
    "zlib >= 1.3.0",
    "bzip2-libs >= 1.0.8",
    "xz-libs >= 5.8.0",
    "zstd-libs >= 1.5.0",
    "acl >= 2.3.0",
    "attr >= 2.5.0",
]

build_dependencies = [
    "pkgconf >= 2.0.0",
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.0",
]

provides = [
    "libarchive",
    "so:libarchive.so",
    "so:libarchive.so.13",
]

prepare = [
]

build = [
    "./configure --prefix=/usr --disable-static --without-xml2 --with-expat --without-cng --with-openssl --with-zlib --with-bz2lib --with-lzma --with-zstd",
    "make -j$(nproc)",
]

install = [
    "make install DESTDIR=$DESTDIR",
]
