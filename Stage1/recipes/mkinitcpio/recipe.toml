schema_version = 1

[package]
name = "mkinitcpio"
version = "41.1"
release = "8"
description = "Modular initramfs image creation utility"
license = "GPL-2.0-only"
channel = "system"

[source]
url = "https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v41.1/mkinitcpio-v41.1.tar.gz"
sha256 = "202ffca349ceb6b62513cc65a67d6fc0c0c15cacc72710ce5228b444cf1317e6"

dependencies = [
    "bash >= 5.2",
    "kmod >= 34.0",
    "coreutils >= 9.0",
    "util-linux >= 2.40",
    "findutils >= 4.9",
    "grep >= 3.10",
    "gawk >= 5.3",
    "sed >= 4.9",
    "zstd >= 1.5.0",
    "libarchive >= 3.7.0",
    "systemd >= 256.0",
]

build_dependencies = [
    "meson >= 1.0.0",
    "ninja >= 1.11.0",
    "pkgconf >= 2.0.0",
]

provides = [
    "mkinitcpio",
    "virtual/initramfs-generator",
]

prepare = [
    "patch -p1 < \"$RECIPE_DIR/stage1-runtime-paths.patch\"",
    "patch -p1 < \"$RECIPE_DIR/lvm2-runtime-tools.patch\"",
]

build = [
    "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc -Ddocs=false",
    "ninja -C build",
]

install = [
    "DESTDIR=$DESTDIR ninja -C build install",
    "grep -rlZ 'LC_ALL=C.UTF-8' $DESTDIR/usr/bin/mkinitcpio $DESTDIR/usr/lib/initcpio | xargs -0 sed -i 's/LC_ALL=C.UTF-8/LC_ALL=C/g'",
    "install -d $DESTDIR/etc",
    "printf 'MODULES=()\nBINARIES=(/usr/bin/lvm /usr/bin/dmsetup)\nFILES=()\nHOOKS=(systemd modconf block lvm2 filesystems fsck)\nCOMPRESSION=\"zstd\"\n' > $DESTDIR/etc/mkinitcpio.conf",
]

[[capability_hooks]]
capability = "virtual/initramfs-generator"
exec = "/usr/bin/mkinitcpio"
args = ["-P"]
