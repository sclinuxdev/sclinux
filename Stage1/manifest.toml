# Sage Linux Stage 1 构建清单（全量重建，不继承）
# - 顺序 = 依赖拓扑排序（recipe 的 dependencies + build_dependencies 自动生成，
#   重放：python3 stage1/scripts/gen-order.py --write）；batch 字段仅为设计分组标记。
# - 所有 120 个包 action = "build"：stage1 在 stage0 chroot（/mnt）内全量重建。
# - 默认只构建不安装（STAGE1_INSTALL=1 时逐包安装进构建 chroot 供后续构建依赖）。
schema_version = 1
stage = 1

